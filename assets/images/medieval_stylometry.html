ue leur valeur a rendus c\u00e9l\u00e8bres ;","en particulier sur l\u2019ordre de la basilissa,","il entreprit d\u2019\u00e9crire l\u2019histoire d\u2019Alexis,","l\u2019autocrator des Romains,","et d\u2019exposer dans un ouvrage en plusieurs livres les actes de son r\u00e8gne"],"x":{"dtype":"f8","bdata":"UNXtuo8doD+0XnTB94XCP3HkbEyJkLe\u002fAFV5PIGwzj9MheqtfgnLP\u002f7UYqxOPNo\u002f+9RirE482j+rIZ0yU\u002fqvv\u002friqvmjomy\u002f7UlU+UmDtT95mkZdh7\u002fHP\u002f1VP3o+X7O\u002fRu0JGQMprb\u002fkK1s4gH27v8kcyWh0O8W\u002fWOE7fW\u002fJyz+rDzigK47Rv45uj1iSaLC\u002ftJZakizJs7\u002fq909B6DXQP8AWNFHgcq+\u002fTBub41Jqpb\u002fiMM8ODTu+Pw=="},"y":{"dtype":"f8","bdata":"pojZNxentb81LnLQ2yiav\u002fLLaTKKOLm\u002fU70muqr0yb8jJp0C8JzOP22l5pY93KK\u002fZKXmlj3cor+zAyX3B9OPvxvbJjZtdWM\u002fhupIfFEvpD8RyiOqr6SQPykUsxU3UbA\u002fg+Q\u002f+L\u002f7or\u002fHISVAuliRv+PiciMAWrG\u002fJskKDWRiqL+9H4POrLehP3LmowWnf7q\u002fHMjL5zECoT\u002fXr3I7PxOEvzJgIcjKTnA\u002f5gOLyigSsb8\u002ffS9b4E\u002fLvw=="},"type":"scatter"},{"hovertemplate":"\u003cb\u003e%{name}\u003c\u002fb\u003e\u003cbr\u003e'%{text}'\u003cextra\u003e\u003c\u002fextra\u003e","line":{"dash":"dot","width":0.5},"marker":{"color":"#FFFFFF","line":{"color":"white","width":0.5},"opacity":0.7,"size":8},"mode":"markers+lines","name":"Hildegard von Bingen","text":["Comme est grand en sa force le c\u00f4t\u00e9 de l\u2019homme","d\u2019o\u00f9 Dieu a fait sortir la forme de la femme,","dont il a fait le miroir de toute sa beaut\u00e9","et l\u2019entrelacement de toute sa cr\u00e9ation.","D\u00e8s lors les instruments c\u00e9lestes r\u00e9sonnent","et toute la terre s\u2019\u00e9merveille,","car Dieu t\u2019a tant aim\u00e9e.","Combien faut-il d\u00e9plorer et regretter","que, pour une faute commise","sur les conseils du serpent,","la tristesse se soit infiltr\u00e9e dans la femme !","dont Dieu a fait la m\u00e8re de tous","s\u2019est lac\u00e9r\u00e9 les entrailles","avec les blessures de l\u2019ignorance","et a port\u00e9 sa pleine douleur p 0eatre consol\u00e9,","mais quand tu apparais,","tous mes soucis et mes ennuis s'envolent.","Si tu avais \u00e9t\u00e9 vraiment sinc\u00e8re dans l\u2019amour qui nous unissait,","tu n\u2019aurais pas pr\u00e9f\u00e9r\u00e9,","\u00e0 moi, un de mes propres esclaves.","Ce faisant, vous avez m\u00e9pris\u00e9 la branche qui fleurit de beaut\u00e9 et choisi une branche qui ne porte que des fruits durs et amers.","Tu sais que je suis la lune claire et brillante des cieux mais,","tu as choisi, \u00e0 la place, une plan\u00e8te sombre et ombrag\u00e9e.","Le surnom qu'ils vous donnent est Num\u00e9ro Six et il vous restera jusqu'\u00e0 votre mort parce que vous \u00eates une tapette,","un salaud, un fornicateur, un cocu, un porc et un voleur.","Si un phallus pouvait devenir un palmier,","vous vous transformeriez en Picidae.","Je suis jaloux de mes yeux, de moi partout, de toi-m\u00eame, de ton temps et de ton lieu.","M\u00eame si tu es grav\u00e9 dans mes pupilles,","ma jalousie ne cessera jamais."],"x":{"dtype":"f8","bdata":"s1Bj5CyQor\u002fHh4IXn8G+v7vRl98s9cM\u002f4eEYQ9Gpwr8t5UjG3sawv6dyK8IUOsm\u002fRwy1zrNL0b\u002fqqVxkQbnNv4tDmf\u002fCD8Q\u002fU1BUtRi8r78YVJK+aFS1v43uU0Q3\u002fcO\u002fKS3X05Yjwb+\u002fLpZoBHKOPxachTMTTcK\u002fYcMVXwOay78znnD1aVxyPyiLufv5V8G\u002fHO97NoEUw7+nS\u002fSdGrHAP9Nice0TQaE\u002fOYKg6LDEob\u002fDkWkK+q2nP4vBC3J+ocS\u002fQUJ1mnyKiL8K+2t0cpqyv316RtSLRLW\u002fIluWU\u002fbI0D\u002fgcHqjGw7Cv2VMVpRm68G\u002f"},"y":{"dtype":"f8","bdata":"7Rx4Bs8Jl7\u002f3z1ezaHavv8RkNJjWGKu\u002fXV0OiWP0wj8JBfjvwl2BP66vsjo1Dp2\u002fNu0J+MlJwT\u002fuAYg1kfzBvwE+56WaVaa\u002fA760PUTk0b823RfdKHixv2K3KRqiepa\u002fsEGlCHghvr8A555Ux13Hv8\u002fl8djC\u002fYe\u002fnQ4453Kisr+cQeBJfODFv3CHD8t\u002fUMG\u002fMxxx4n5IqL9l\u002fU6EvxvSvyoDsQafros\u002f+P1LPCHHtb\u002ftBa7WR2Gkv\u002f6ZmdoiEsI\u002fCqYLL46A1b9orbJmPz3Uv+2MXkg6gpo\u002fZPt1+PUQvr+VG57xKxbRvzeGMt0Sz5S\u002f"},"type":"scatter"}],                        {"template":{"data":{"histogram2dcontour":[{"type":"histogram2dc
